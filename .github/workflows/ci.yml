name: ci
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"  # daily job refresh, 07:00 IST
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: GOOGLE_API_KEY=x python -m pytest -q
  image:
    # Builds the Cloud Run image and checks that it serves the app within the startup window.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobpilot .
      - run: |
          docker run -d --name app -p 8080:8080 -e PORT=8080 -e GOOGLE_API_KEY=x --memory 2g jobpilot
          for i in $(seq 120); do curl -sf localhost:8080/ >/dev/null && echo "up after ${i}x2s" && break; sleep 2; done
          docker stats --no-stream app; docker logs app | tail -5
          curl -sf localhost:8080/ >/dev/null
  data:
    # Refreshes the job index and publishes it as the "data" release; the hosted app downloads it on start.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/vectors.npz
          key: vectors-${{ github.run_id }}
          restore-keys: vectors-
      - run: python -m jobpilot.ingest
      # Only new jobs get embedded (first run: all of them). Saves after every 256,
      # and the cache step below keeps that progress even if this step times out.
      - run: python -c "from jobpilot.retrieve import Index; Index.build()"
        timeout-minutes: 40
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/vectors.npz') != ''
        with:
          path: data/vectors.npz
          key: vectors-${{ github.run_id }}
      - name: Peak memory of the app's search path (free hosts give 512MB)
        env: { GOOGLE_API_KEY: x }
        run: |
          python -c "
          import re
          rss = lambda tag: print(tag, *re.findall(r'(VmRSS|VmHWM):\s+(\d+)', open('/proc/self/status').read()))
          import app; rss('imports')
          from jobpilot.retrieve import get_index
          ix = get_index(); rss('index')
          print(len(ix.search('junior ML engineer pytorch')), 'hits'); rss('search')"
      - run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Job index" --notes "Refreshed daily by CI."
          gh release upload data data/jobs.jsonl data/vectors.npz --clobber
