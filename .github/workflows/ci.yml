name: ci
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"  # daily job refresh, 07:00 IST
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: GOOGLE_API_KEY=x python -m pytest -q
  deploy:
    # Set up once: repo secret HF_TOKEN (write token) and repo variable HF_SPACE (e.g. yourname/jobpilot).
    needs: test
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python scripts/deploy_space.py pull
      - run: python -m jobpilot.ingest
      - run: python -c "from jobpilot.retrieve import Index; Index.build()"  # local bge-small, no API key
      - run: python scripts/deploy_space.py push
