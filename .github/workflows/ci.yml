name: ci
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"  # daily job refresh, 07:00 IST
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: GOOGLE_API_KEY=x python -m pytest -q
  deploy:
    # Set up once: repo secret HF_TOKEN (write token) and repo variable HF_SPACE (e.g. yourname/jobpilot).
    needs: test
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache/restore@v4  # vectors from the last run, in case the Space doesn't have them yet
        with:
          path: data/vectors.npz
          key: vectors-${{ github.run_id }}
          restore-keys: vectors-
      - run: python scripts/deploy_space.py pull
      - run: python -m jobpilot.ingest
      # Only new jobs get embedded (first run: all of them, ~10-15 min on CPU). Saves after every 256,
      # and the cache step below keeps that progress even if this step times out.
      - run: python -c "from jobpilot.retrieve import Index; Index.build()"
        timeout-minutes: 40
      - uses: actions/cache/save@v4
        if: always() && hashFiles('data/vectors.npz') != ''
        with:
          path: data/vectors.npz
          key: vectors-${{ github.run_id }}
      - run: python scripts/deploy_space.py push
